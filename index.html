<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Protezione contro l'esecuzione di codice non previsto: la pagina può caricare script solo dall'app stessa
  e dai pochi servizi elencati qui (mappe, accesso Google/Firebase, lettura foto). Niente altro.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'wasm-unsafe-eval' https://unpkg.com https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://unpkg.com;
  img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://unpkg.com https://*.googleusercontent.com;
  connect-src 'self' https://script.google.com https://script.googleusercontent.com https://nominatim.openstreetmap.org https://api.anthropic.com https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://cdn.jsdelivr.net https://unpkg.com;
  worker-src 'self' blob:;
  frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://content.googleapis.com;
  manifest-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fbe6cf">
<meta name="color-scheme" content="light">
<title>Attività ed eventi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Attività ed eventi</h1>
  <span id="syncState" class="sync" role="status"></span>
  <button id="btnSettings" class="icon-btn" aria-label="Impostazioni">⚙️</button>
</header>

<div id="filters" class="filters"></div>

<main>
  <div id="news" class="news" hidden></div>
  <section id="calendar" class="card" aria-label="Calendario"></section>
  <section id="mapCard" class="card map-card" aria-label="Mappa">
    <div id="map"></div>
    <div id="mapBtns" class="map-btns"></div>
    <div id="pickBanner" class="pick-banner" hidden></div>
  </section>
  <section id="sections" aria-label="Elenchi"></section>
</main>

<button id="fab" class="fab" aria-label="Aggiungi" hidden>＋</button>

<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>
<div id="gate" class="gate" hidden></div>

<noscript><p style="padding:16px">Serve JavaScript per usare l'app.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
